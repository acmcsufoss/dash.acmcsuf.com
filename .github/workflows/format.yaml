name: Format Checker
on: 
  push:
  branches: [main]
  pull_request: 
    branches: [main]

jobs:
  prettier:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      name: Checkout code
      uses: actions/checkout@v4

      name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version, 'lts/*'

        